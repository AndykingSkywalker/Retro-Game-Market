services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: retro-game-market-frontend:latest
    container_name: retro-game-market-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://host.docker.internal:8088}
    ports:
      - "3000:3000"
    restart: unless-stopped
